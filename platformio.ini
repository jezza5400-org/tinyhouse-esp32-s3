; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
lib_deps = 
	arduino-libraries/WiFiNINA@^2.0.0
	bblanchon/ArduinoJson@^7.4.0
	PaulStoffregen/OneWire@^2.3.0
	milesburton/DallasTemperature@^4.0.0
	adafruit/DHT sensor library@^1.4.0
	adafruit/Adafruit Unified Sensor@^1.1.0

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8 module settings (keep devkit pin variant, enable 16MB+PSRAM profile)
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	-DBOARD_HAS_PSRAM
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
lib_deps = 
	bblanchon/ArduinoJson@^7.4.0
	PaulStoffregen/OneWire@^2.3.0
	milesburton/DallasTemperature@^4.0.0
	htmltiger/dhtESP32-rmt@^2.0.0