; PlatformIO Project Configuration File
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = boards

[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
lib_deps = 
	arduino-libraries/WiFiNINA@^2.0.0
	bblanchon/ArduinoJson@^7.4.0
	PaulStoffregen/OneWire@^2.3.0
	milesburton/DallasTemperature@^4.0.0
	adafruit/DHT sensor library@^1.4.0
	adafruit/Adafruit Unified Sensor@^1.1.0

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
lib_deps = 
	bblanchon/ArduinoJson@^7.4.0
	PaulStoffregen/OneWire@^2.3.0
	milesburton/DallasTemperature@^4.0.0
	htmltiger/dhtESP32-rmt@^2.0.0

[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
; board's mDNS host or IP. Can be override with --upload-port
upload_port = esp32s3.local
upload_flags =
	--port=3232